<title>Deals</title>
<style>
:root { --bg:#f5f6f8; --panel:#fff; --line:#e3e6ec; --fg:#14171f; --muted:#5d6678; --ok:#0d8f5a; --bad:#c53030; --warn:#a86a00; --acc:#2456e6; --accfg:#fff; }
@media (prefers-color-scheme: dark) { :root { --bg:#0b0d12; --panel:#141821; --line:#252b38; --fg:#eceff5; --muted:#98a2b6; --ok:#3ddc97; --bad:#ff6b6b; --warn:#f5c451; --acc:#6b8cff; --accfg:#0b0d12; } }
* { box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding-bottom:env(safe-area-inset-bottom); }
header { padding:calc(14px + env(safe-area-inset-top)) 16px 8px; }
h1 { margin:0; font-size:1.5rem; letter-spacing:-.01em; }
.stand { color:var(--muted); font-size:.9rem; margin:2px 0 0; }
.bar { position:sticky; top:0; z-index:5; background:var(--bg); padding:8px 16px 10px; border-bottom:1px solid var(--line); display:grid; gap:8px; }
.chips { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; scrollbar-width:none; }
.chips::-webkit-scrollbar { display:none; }
.chip { flex:none; min-height:44px; padding:0 14px; border:1px solid var(--line); border-radius:22px; background:var(--panel); color:var(--fg); font:inherit; font-size:.95rem; }
.chip[aria-pressed=true] { background:var(--acc); color:var(--accfg); border-color:var(--acc); font-weight:600; }
.row { display:flex; gap:8px; align-items:center; }
select, .toggle { min-height:44px; border:1px solid var(--line); border-radius:12px; background:var(--panel); color:var(--fg); font:inherit; padding:0 12px; }
select { flex:1; }
main { padding:12px 16px 32px; display:grid; gap:12px; max-width:720px; margin:0 auto; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:14px; display:grid; gap:10px; }
.card.done { opacity:.55; }
.top { display:flex; gap:8px; justify-content:space-between; align-items:flex-start; }
h2 { margin:0; font-size:1.1rem; line-height:1.25; overflow-wrap:anywhere; }
.badge { flex:none; background:var(--acc); color:var(--accfg); border-radius:8px; padding:2px 8px; font-size:.78rem; font-weight:700; }
.sub { color:var(--muted); font-size:.9rem; overflow-wrap:anywhere; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.m { background:var(--bg); border-radius:12px; padding:8px 10px; }
.m span { display:block; color:var(--muted); font-size:.78rem; }
.m b { font-size:1.15rem; font-variant-numeric:tabular-nums; }
.pos { color:var(--ok); }
.tags { display:flex; flex-wrap:wrap; gap:6px; }
.tag { font-size:.82rem; padding:3px 8px; border:1px solid var(--line); border-radius:8px; color:var(--muted); }
.tag.warn { color:var(--warn); border-color:var(--warn); }
.acts { display:grid; grid-template-columns:1.4fr 1fr 1fr; gap:8px; }
.btn { display:flex; align-items:center; justify-content:center; min-height:48px; border-radius:12px; border:1px solid var(--line); background:var(--panel); color:var(--fg); font:inherit; font-size:.95rem; text-decoration:none; }
.btn.primary { background:var(--acc); color:var(--accfg); border-color:var(--acc); font-weight:600; }
.empty { text-align:center; color:var(--muted); padding:32px 8px; }
footer { color:var(--muted); font-size:.8rem; padding:0 16px 24px; text-align:center; }
</style>
</head>

  </div>
</div>

  function save() { try { localStorage.setItem(KEY, JSON.stringify(Array.from(done))); } catch (e) { /* private mode */ } }
  var eur = new Intl.NumberFormat('de-DE', { style: 'currency', currency: 'EUR' });
  var pct = new Intl.NumberFormat('de-DE', { style: 'percent', maximumFractionDigits: 0 });
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function uniq(key) { var s = {}; deals.forEach(function (d) { s[d[key]] = 1; }); return Object.keys(s).sort(); }
  function chips(box, key, getter, setter) {
    box.replaceChildren();
    ['alle'].concat(uniq(key)).forEach(function (v) {
      var b = el('button', 'chip', v === 'alle' ? 'Alle' : v); b.type = 'button'; b.setAttribute('aria-pressed', String(getter() === v));
      b.onclick = function () { setter(v); render(); }; box.append(b);
    });
  }
  function metric(label, value, cls) { var m = el('div', 'm'); m.append(el('span', null, label)); m.append(el('b', cls, value)); return m; }
  function card(d) {
    var c = el('article', 'card' + (done.has(d.fp) ? ' done' : ''));
    var top = el('div', 'top'); top.append(el('h2', null, d.name || '–'));
    if (d.new) top.append(el('span', 'badge', 'NEU')); c.append(top);
    c.append(el('div', 'sub', [d.set, d.game, d.src, d.kind === 'sealed' ? 'Sealed' : null].filter(Boolean).join(' · ')));
    if (d.title && d.title !== d.name) c.append(el('div', 'sub', d.title));
    var g = el('div', 'grid');
    g.append(metric('Kauf (' + d.src + ')', eur.format(d.buy)), metric('Cardmarket realistisch', eur.format(d.sell)),
             metric('Nettogewinn', '+' + eur.format(d.net), 'pos'), metric('Rendite', pct.format(d.roi), 'pos'));
    c.append(g);
    var tags = el('div', 'tags');
    if (d.liq != null) tags.append(el('span', 'tag', 'Liquidität ' + d.liq + '/100'));
    if (d.etts) tags.append(el('span', 'tag', 'Verkauf ' + d.etts));
    d.tags.forEach(function (t) { tags.append(el('span', 'tag' + (/^Cardmarket:/.test(t) ? ' warn' : ''), t)); });
    c.append(tags);
    if (d.note) c.append(el('div', 'sub', d.note));
    var a = el('div', 'acts');
    var open = el('a', 'btn primary', 'Angebot öffnen'); open.href = d.url || '#'; open.target = '_blank'; open.rel = 'noopener noreferrer'; a.append(open);
    var cm = el('a', 'btn', 'Cardmarket'); if (d.cm) { cm.href = d.cm; cm.target = '_blank'; cm.rel = 'noopener noreferrer'; } a.append(cm);
    var ok = el('button', 'btn', done.has(d.fp) ? 'Zurück' : 'Erledigt'); ok.type = 'button';
    ok.onclick = function () { if (done.has(d.fp)) done.delete(d.fp); else done.add(d.fp); save(); render(); }; a.append(ok);
    c.append(a); return c;
  }
  function render() {
    chips(document.getElementById('games'), 'game', function () { return game; }, function (v) { game = v; });
    chips(document.getElementById('sources'), 'src', function () { return source; }, function (v) { source = v; });
    var sort = document.getElementById('sort').value;
    var rows = deals.filter(function (d) {
      return (game === 'alle' || d.game === game) && (source === 'alle' || d.src === source) && (showDone || !done.has(d.fp));
    }).sort(function (a, b) {
      if (sort === 'new') return (b.seen || '').localeCompare(a.seen || '') || b.net - a.net;
      return (b[sort] == null ? -1e9 : b[sort]) - (a[sort] == null ? -1e9 : a[sort]);
    });
    var list = document.getElementById('list'); list.replaceChildren();
    if (!rows.length) list.append(el('div', 'empty', 'Keine Deals für diese Auswahl.'));
    rows.forEach(function (d) { list.append(card(d)); });
    var sd = document.getElementById('showdone'); sd.setAttribute('aria-pressed', String(showDone));
    sd.textContent = showDone ? 'Erledigte ausblenden' : 'Erledigte anzeigen (' + deals.filter(function (d) { return done.has(d.fp); }).length + ')';
  }
  document.getElementById('sort').onchange = render;
  document.getElementById('showdone').onclick = function () { showDone = !showDone; render(); };
  var s = new Date(meta.stand);
  document.getElementById('stand').textContent = 'Stand ' + s.toLocaleString('de-DE', { dateStyle: 'medium', timeStyle: 'short' }) + ' · ' + deals.length + ' Deals · ' + meta.new + ' neu';
  document.getElementById('foot').textContent = 'Kriterien: Referenzwert ab ' + meta.min_ref + ' €, Nettogewinn ab ' + meta.min_net + ' €, Rendite ab ' + Math.round(meta.min_roi * 100) + ' %, nach Gebühren und Versand. ' + (meta.note || '') + ' Schätzungen, bitte Angebot vor dem Kauf prüfen.';
  render();
})();
</script>
</body>
</html>
